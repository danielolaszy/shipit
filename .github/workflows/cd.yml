name: CD

#on:
#  push:
#    branches:
#      - main

on:
  pull_request:
    branches:
      - main

env:
  AWS_REGION: eu-west-2
  AWS_ECR_NAME: app/shipit
  IMAGE_TAG: latest
  GITHUB_REPOSITORY: ${{ github.event.repository.name }}
  GITHUB_OWNER: ${{ github.repository_owner }}
  TF_LOG: debug

jobs:

  golangci:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: go mod tidy

      - name: Run unit tests
        run: go test ./... -v -cover

  gosec:
    name: Gosec Security Scanning
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master

  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: provision-infrastructure

    permissions:
      id-token: write   # Required for OIDC
      contents: read


    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
        env:
          ACTIONS_STEP_DEBUG: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t ${{ env.AWS_ECR_NAME }} .

      - name: Docker Tag image
        run: docker tag ${{ env.AWS_ECR_NAME }}:${{ env.IMAGE_TAG }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.AWS_ECR_NAME }}:${{ env.IMAGE_TAG }}

      - name: Push Docker Image
        run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.AWS_ECR_NAME }}:${{ env.IMAGE_TAG }}

  provision-infrastructure:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - gosec
      - golangci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" -var="github_owner=${{ env.GITHUB_OWNER }}" -var="github_repository=${{ env.GITHUB_REPOSITORY }}" 

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" -var="github_owner=${{ env.GITHUB_OWNER }}" -var="github_repository=${{ env.GITHUB_REPOSITORY }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" -var="github_owner=${{ env.GITHUB_OWNER }}" -var="github_repository=${{ env.GITHUB_REPOSITORY }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}

name: CD

on:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: eu-west-2
  AWS_ECR_NAME: app/${{ github.event.repository.name }}
  AWS_S3_BUCKET: my-terraform-state-store-4lfu1ej4
  AWS_S3_BUCKET_KEY: ${{ github.event.repository.name }}/terraform.tfstate
  AWS_DYNAMODB_TABLE: terraform-lock-table
  IMAGE_TAG: latest
  GITHUB_REPOSITORY: ${{ github.event.repository.name }}
  GITHUB_OWNER: ${{ github.repository_owner }}
  TF_LOG: debug

jobs:

  golangci:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: go mod tidy

      - name: Run unit tests
        run: go test ./... -v -cover

  gosec:
    name: Gosec Security Scanning
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master

  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: provision-infrastructure

    permissions:
      id-token: write   # Required for OIDC
      contents: read


    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
        env:
          ACTIONS_STEP_DEBUG: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t ${{ env.AWS_ECR_NAME }} .

      - name: Tag Docker image
        run: docker tag ${{ env.AWS_ECR_NAME }}:${{ env.IMAGE_TAG }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.AWS_ECR_NAME }}:${{ env.IMAGE_TAG }}

      - name: Push Docker Image
        run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.AWS_ECR_NAME }}:${{ env.IMAGE_TAG }}

  provision-infrastructure:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - gosec
      - golangci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
          -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
          -var="github_owner=${{ env.GITHUB_OWNER }}" \
          -var="github_repository=${{ env.GITHUB_REPOSITORY }}" \
          -var="aws_ecr_repository_name=${{ env.AWS_ECR_NAME }}" \
          -backend-config="bucket=${{env.AWS_S3_BUCKET}}" \
          -backend-config="key=${{env.AWS_S3_BUCKET_KEY}}" \
          -backend-config="region=${{ env.AWS_REGION }}" \
          -backend-config="dynamodb_table=${{ env.AWS_DYNAMODB_TABLE }}" 

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
          -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
          -var="github_owner=${{ env.GITHUB_OWNER }}" \
          -var="github_repository=${{ env.GITHUB_REPOSITORY }}" \
          -var="aws_ecr_repository_name=${{ env.AWS_ECR_NAME }}" \
          -var="aws_s3_bucket=${{ env.AWS_S3_BUCKET }}" \
          -var="aws_dynamodb_table=${{ env.AWS_DYNAMODB_TABLE }}" \
          -out=tfplan 

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply \
          -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
          -var="github_owner=${{ env.GITHUB_OWNER }}" \
          -var="github_repository=${{ env.GITHUB_REPOSITORY }}" \
          -var="aws_ecr_repository_name=${{ env.AWS_ECR_NAME }}" \
          -var="aws_s3_bucket=${{ env.AWS_S3_BUCKET }}" \
          -var="aws_dynamodb_table=${{ env.AWS_DYNAMODB_TABLE }}" \
          -auto-approve \
          tfplan

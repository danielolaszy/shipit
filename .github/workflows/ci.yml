name: CI

on:
  pull_request:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: eu-west-2
  AWS_ECR_NAME: app/${{ github.event.repository.name }}
  AWS_S3_BUCKET: my-terraform-state-store-4lfu1ej4
  AWS_S3_BUCKET_KEY: ${{ github.event.repository.name }}/terraform.tfstate
  AWS_DYNAMODB_TABLE: terraform-lock-table
  IMAGE_TAG: latest
  GITHUB_REPOSITORY: ${{ github.event.repository.name }}
  GITHUB_OWNER: ${{ github.repository_owner }}
  TF_LOG: debug

jobs:

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: webiny/action-conventional-commits@v1.3.0

  golangci:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: golangci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: go mod tidy

      - name: Run unit tests
        run: go test ./... -v -cover

  gosec:
    name: Gosec Security Scanning
    runs-on: ubuntu-latest

    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master

  docker-build: # Creating a temporary Docker image for build validation
    name: Build Validation
    runs-on: ubuntu-latest
    needs:
      - golangci
      - unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t tmp-${{ env.AWS_ECR_NAME }} .

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
          -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
          -var="github_owner=${{ env.GITHUB_OWNER }}" \
          -var="github_repository=${{ env.GITHUB_REPOSITORY }}" \
          -var="aws_ecr_repository_name=${{ env.AWS_ECR_NAME }}" \
          -backend-config="bucket=${{env.AWS_S3_BUCKET}}" \
          -backend-config="key=${{env.AWS_S3_BUCKET_KEY}}" \
          -backend-config="region=${{ env.AWS_REGION }}" \
          -backend-config="dynamodb_table=${{ env.AWS_DYNAMODB_TABLE }}" 

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
          -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
          -var="github_owner=${{ env.GITHUB_OWNER }}" \
          -var="github_repository=${{ env.GITHUB_REPOSITORY }}" \
          -var="aws_ecr_repository_name=${{ env.AWS_ECR_NAME }}" \
          -var="aws_s3_bucket=${{ env.AWS_S3_BUCKET }}" \
          -var="aws_dynamodb_table=${{ env.AWS_DYNAMODB_TABLE }}"

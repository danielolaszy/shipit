name: CI

on:
  pull_request:
    branches:
      - main

jobs:

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: webiny/action-conventional-commits@v1.3.0
  
  golangci:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: golangci  # Run only after linting job is successful
    steps:
      - uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: stable

      - name: Install dependencies
        run: go mod tidy

      - name: Run unit tests
        run: go test ./... -v -cover

  docker-build: # Creating a temporary Docker image for build validation
    name: Build Validation
    runs-on: ubuntu-latest
    needs:
      - golangci
      - unit-tests
    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t temp-shipit ./


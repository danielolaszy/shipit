name: Terraform Destroy

on:
  workflow_dispatch:

jobs:

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-west-2
      AWS_S3_BUCKET: my-terraform-state-store-4lfu1ej4
      AWS_S3_BUCKET_KEY: ${{ github.event.repository.name }}/terraform.tfstate
      AWS_DYNAMODB_TABLE: terraform-lock-table
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
#          cli_config_credentials_token: ${{ secrets.TF_CLI_CONFIG_TOKEN }}

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
          -backend-config="bucket=${{env.AWS_S3_BUCKET}}" \
          -backend-config="key=${{env.AWS_S3_BUCKET_KEY}}" \
          -backend-config="region=${{ env.AWS_REGION }}" \
          -backend-config="dynamodb_table=${{ env.AWS_DYNAMODB_TABLE }}"

      - name: Terraform Destroy
        run: |
          cd terraform
          terraform destroy -auto-approve -lock=false
#          -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
#          -var="github_owner=${{ secrets.GITHUB_OWNER }}" \
#          -var="github_repository=${{ secrets.GITHUB_REPOSITORY }}" \
#          -var="aws_s3_bucket=${{ secrets.AWS_S3_BUCKET }}" \
#          -var="aws_dynamodb_table=${{ secrets.AWS_DYNAMODB_TABLE }}"